/* ضغط الصور قبل الرفع (يوفر المساحة) */
async function compress(file, max = 1600){
  if (!file.type.startsWith('image/')) return file;
  const img = await createImageBitmap(file);
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}
async function upload(bucket, folder, file){
  if (!file) return null;
  if (file.size > 10 * 1024 * 1024) throw new Error('الملف كبير جدًا');
  const blob = await compress(file);
  const ext = blob.type === 'application/pdf' ? 'pdf' : 'jpg';
  const path = `${S.session.user.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  must(await sb.storage.from(bucket).upload(path, blob, { contentType: blob.type || 'image/jpeg', upsert:false }));
  return path;
}
async function openDoc(path){

function shell(body, active){
  const r = S.me?.role;
  const links = r === 'doctor' ? [['#/shifts','شيفتات','search'],['#/bookings','حجوزاتي','cal'],['#/rentals','إيجار سنوي','key'],['#/profile','ملفي','user']]
    : r === 'clinic' ? [['#/clinic','عيادتي','home'],['#/clinic/new','شيفت جديد','plus'],['#/clinic/rentals','إيجار سنوي','key'],['#/clinic/edit','البيانات','user']]
    : r === 'admin' ? [['#/admin','الإدارة','shield']] : [];
  app.innerHTML = `
    <header class="top"><a class="brand" href="#/" aria-label="DentaCore Shift"><span class="logo">${MARK}</span><span class="bname"><small>DENTACORE</small><b>Shift</b></span></a>
      ${S.session ? '<button class="btn sec" id="logout" style="min-height:40px">خروج</button>' : ''}</header>
    <main>${body}</main>
    ${legalLinks()}
    ${links.length ? `<nav class="bottom" aria-label="التنقل الرئيسي"><div class="in">${links.map(([h,t,i]) =>
      `<a href="${h}" ${active === h ? 'aria-current="page"' : ''}>${icon[i]}${t}</a>`).join('')}</div></nav>` : ''}`;
  $('logout')?.addEventListener('click', async () => { await sb.auth.signOut(); location.hash = '#/'; });
}
const loading = () => { app.querySelector('main') ? app.querySelector('main').innerHTML = '<div class="spin">جاري التحميل…</div>' : null; };

async function loadMe(){
  S.me = S.doctor = S.clinic = null;
  if (!S.session) return;
  const uid = S.session.user.id;
  S.me = must(await sb.from('profiles').select('*').eq('id', uid).single());
  S.contact = (await sb.from('contacts').select('*').eq('user_id', uid).maybeSingle()).data || {};
  if (S.me.role === 'doctor') S.doctor = must(await sb.from('doctors').select('*').eq('id', uid).single());
  if (S.me.role === 'clinic') S.clinic = ((await sb.rpc('clinic_full')).data || [])[0] || null;
  const st = must(await sb.from('settings').select('*'));
  S.settings = Object.fromEntries(st.map(x => [x.key, x.value]));
}

function viewAuth(mode = 'login'){
  shell(`
    <div class="card stack">
      <h1>${mode === 'login' ? 'تسجيل الدخول' : 'حساب جديد'}</h1>
      <p class="muted" style="margin:0">منصة لحجز شيفتات في عيادات أسنان مجهزة، ولأصحاب العيادات اللي عندهم كراسي فاضية.</p>
      ${mode === 'signup' ? `
        <div><span class="muted">أنا</span>
          <div class="seg" role="group" aria-label="نوع الحساب">
            <button type="button" id="r-doc" aria-pressed="true">طبيب بدوّر على شيفت</button>
            <button type="button" id="r-cl" aria-pressed="false">صاحب عيادة</button>
          </div></div>
        <div><label for="f-name">الاسم بالكامل</label><input id="f-name" autocomplete="name" maxlength="80"></div>
        <div class="grid2">
          <div><label for="f-phone">الموبايل</label><input id="f-phone" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div>
          <div><label for="f-area">المنطقة</label><input id="f-area" placeholder="مدينة نصر" maxlength="80"></div>
        </div>` : ''}
      <div><label for="f-email">الإيميل</label><input id="f-email" type="email" autocomplete="email" dir="ltr"></div>
      <div><label for="f-pass">كلمة السر</label><input id="f-pass" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" dir="ltr" minlength="8"></div>
      ${mode === 'signup' ? `<label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px">
        <input type="checkbox" id="f-terms" style="width:22px;min-height:22px;margin-top:2px;flex:none">
        <span>قرأت ووافقت على <a href="#/terms" target="_blank">شروط الاستخدام</a> و<a href="#/privacy" target="_blank">سياسة الخصوصية</a> و<a href="#/refund" target="_blank">سياسة الإلغاء والاسترداد</a><span id="f-clt" hidden> و<a href="#/clinic-terms" target="_blank">اتفاقية العيادات</a></span>، وموافق إن فريق DentaCore Shift يطّلع على المستندات اللي هبعتها علشان يوثّق حسابي.</span></label>` : ''}
      <button class="btn block" id="go">${mode === 'login' ? 'دخول' : 'إنشاء الحساب'}</button>
      <div class="between">
        <a href="#/${mode === 'login' ? 'signup' : 'login'}">${mode === 'login' ? 'معنديش حساب' : 'عندي حساب'}</a>
        ${mode === 'login' ? '<button class="btn sec" id="forgot" style="min-height:40px">نسيت كلمة السر</button>' : ''}
      </div>
    </div>`);
  let role = 'doctor';
  if (mode === 'signup'){
    $('r-doc').onclick = () => { role = 'doctor'; $('r-doc').setAttribute('aria-pressed','true'); $('r-cl').setAttribute('aria-pressed','false'); $('f-clt').hidden = true; };
    $('r-cl').onclick  = () => { role = 'clinic'; $('r-cl').setAttribute('aria-pressed','true'); $('r-doc').setAttribute('aria-pressed','false'); $('f-clt').hidden = false; };
  }
  $('go').onclick = e => run(e.target, async () => {
    const email = $('f-email').value.trim(), password = $('f-pass').value;
    if (mode === 'login'){
      must(await sb.auth.signInWithPassword({ email, password }));
    } else {
      const full_name = $('f-name').value.trim(), phone = $('f-phone').value.replace(/[^0-9+]/g,''), area = $('f-area').value.trim();
      if (full_name.length < 2) throw new Error('اكتب اسمك');
      if (!/^\+?[0-9]{8,15}$/.test(phone)) throw new Error('رقم الموبايل غير صحيح');
      if (password.length < 8) throw new Error('كلمة السر لازم تكون 8 حروف على الأقل');
      if (!$('f-terms').checked) throw new Error('لازم توافق على الشروط والسياسات الأول');
      const r = must(await sb.auth.signUp({ email, password, options:{ data:{ role, full_name, phone, area, terms_version:LEGAL.version } } }));
      if (!r.session) { toast('اتبعتلك رسالة تأكيد على الإيميل، افتحها وبعدين ادخل'); location.hash = '#/login'; }
    }
  });
  $('forgot')?.addEventListener('click', e => run(e.target, async () => {
    const email = $('f-email').value.trim(); if (!email) throw new Error('اكتب إيميلك الأول');
    must(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + '#/reset' }));
    toast('اتبعتلك رابط تغيير كلمة السر');
  }));
}

  const avg = revs.length ? (revs.reduce((a,r) => a + r.rating, 0) / revs.length).toFixed(1) : null;
  const inc = s.includes.length ? s.includes : s.clinics.equipment;
  app.querySelector('main').innerHTML = `

    <section class="card"><h2>الشيفت يشمل</h2><div class="row">${inc.map(t => `<span class="chip">${esc(t)}</span>`).join('') || '<span class="muted">مش محدد</span>'}</div>

      <p class="muted" style="margin-bottom:0">اسم العيادة بيظهرلك بعد ما التحويل يتأكد، وفريق DentaCore Shift بيبعتلك اللوكيشن على واتساب.</p></section>

async function viewBooking(id){
  shell('<div class="spin">جاري التحميل…</div>', '#/bookings');
  const b = (await sb.from('bookings').select('*, shifts(*, clinics(id, area, owner_id))').eq('id', id).maybeSingle()).data;
  if (!b) { app.querySelector('main').innerHTML = '<div class="card">الحجز غير موجود.</div>'; return; }
  const s = b.shifts;
  const inv = s.mode === 'percent' ? must(await sb.from('invoices').select('*').eq('booking_id', id).order('created_at')) : [];
  const total = inv.reduce((a,x) => a + x.amount, 0);
  const cn = await clinicNames([s.clinics?.id]);
  const reviewed = (await sb.from('reviews').select('id').eq('booking_id', id).eq('author_id', S.session.user.id)).data?.length;
  const started = new Date(`${s.shift_date}T${s.start_time}+02:00`) <= new Date();
  let body = `<a href="#/bookings">→ حجوزاتي</a>
    <section class="card stack"><div class="between"><strong>${clinicLabel(cn, s.clinics)}</strong>${chip(b.status)}</div>
      <div class="muted">${dateAr(s.shift_date)} · ${timeAr(s.start_time)} – ${timeAr(s.end_time)}</div>
      <div><span class="price">${priceText(s)}</span> <span class="muted">${modeText(s)}</span></div></section>`;
  if (b.status === 'pending_payment') body += `<div class="notice">لازم تحوّل قبل ${dtAr(b.hold_expires_at)}، وإلا الحجز بيتلغي لوحده.</div>` + payBox(b.amount_due, 'p', b.admin_note);
  if (b.status === 'payment_review') body += `<div class="card notice ok">استلمنا رقم العملية وبنراجعه. هيوصلك التأكيد هنا.</div>`;
  if (['confirmed','settlement_due','settlement_review'].includes(b.status)) {
    const swa = waNum(S.settings?.support_whatsapp);
    body += `<section class="card stack"><h2>اللوكيشن</h2>
        <p style="margin:0">${b.location_sent ? 'فريق DentaCore Shift بعتلك لوكيشن العيادة على واتساب ✓' : 'فريق DentaCore Shift هيبعتلك لوكيشن العيادة وتفاصيل الوصول على واتساب.'}</p>
        ${swa ? `<a class="btn wa block" href="${esc(waHref(swa, `استفسار عن حجز شيفت — ${cn[s.clinics?.id] || ''} — ${s.shift_date}`))}" target="_blank" rel="noopener">${icon.wa} كلّم فريقنا على واتساب</a>` : ''}</section>`;
  }
  if (b.status === 'confirmed' && s.mode === 'percent') body += `
    <section class="card stack"><h2>فواتير الشيفت</h2>
      <p class="muted" style="margin:0">سجّل كل علاج عملته في الشيفت. نصيب العيادة ${Number(s.percent).toLocaleString('ar-EG')}% بحد أدنى ${money(s.min_guarantee)}. ما تكتبش أسماء المرضى.</p>
      ${inv.length ? `<table><tbody>${inv.map(x => `<tr><td>${esc(x.procedure)}</td><td>${money(x.amount)}</td><td><button class="btn bad" data-del="${x.id}" style="min-height:36px">حذف</button></td></tr>`).join('')}</tbody></table>
        <div class="between"><strong>الإجمالي</strong><strong>${money(total)}</strong></div>` : ''}
      <div class="grid2"><div><label for="iv-p">العلاج</label><input id="iv-p" maxlength="80" placeholder="حشو عصب"></div>
        <div><label for="iv-a">المبلغ</label><input id="iv-a" type="number" inputmode="numeric" min="1"></div></div>
      <button class="btn sec" id="iv-add">إضافة فاتورة</button></section>`;
  if (b.status === 'confirmed') body += `<div class="stack">
      <button class="btn block" id="finish" ${started ? '' : 'disabled'}>${started ? 'الشيفت خلص' : 'زرار إنهاء الشيفت بيتفعّل لما يبدأ'}</button>
      <button class="btn bad block" id="cancel">إلغاء الحجز</button></div>`;
  if (b.status === 'pending_payment' || b.status === 'payment_review') body += `<button class="btn bad block" id="cancel">إلغاء الحجز</button>`;
  if (b.status === 'settlement_due') body += `<div class="card stack"><h2>تسوية الشيفت</h2>
      <div class="between"><span>دخل الشيفت</span><strong>${money(b.revenue_total)}</strong></div>
      <div class="between"><span>نصيب العيادة</span><strong>${money(b.clinic_share)}</strong></div>
      <div class="between"><span>اللي دفعته مقدمًا</span><strong>${money(b.amount_due)}</strong></div></div>` + payBox(b.settle_due, 's', b.admin_note);
  if (b.status === 'settlement_review') body += `<div class="card notice ok">استلمنا تحويل التسوية وبنراجعه.</div>`;
  if (b.status === 'cancelled' && b.refund_due > 0) body += `<div class="card ${b.refund_done ? 'notice ok' : 'notice'}">${b.refund_done ? 'رجّعنالك' : 'هيرجعلك'} ${money(b.refund_due)} على إنستاباي المسجل في ملفك.</div>`;
  if (['completed','settlement_due','settlement_review'].includes(b.status) && !reviewed) body += reviewBox();
  app.querySelector('main').innerHTML = body;

  const pay = (pfx, rpc) => $(pfx + '-send')?.addEventListener('click', e => run(e.target, async () => {
    const ref = $(pfx + '-ref').value.trim(); if (!ref) throw new Error('اكتب رقم العملية');
    const proof = await upload('docs', 'proofs', $(pfx + '-file').files[0]);
    must(await sb.rpc(rpc, { p_booking:id, p_ref:ref, p_proof:proof })); toast('اتبعت للمراجعة'); viewBooking(id);
  }));
  pay('p', 'submit_payment'); pay('s', 'submit_settlement');
  $('iv-add')?.addEventListener('click', e => run(e.target, async () => {
    const procedure = $('iv-p').value.trim(), amount = parseInt($('iv-a').value, 10);
    if (procedure.length < 2 || !(amount > 0)) throw new Error('اكتب العلاج والمبلغ');
    must(await sb.from('invoices').insert({ booking_id:id, procedure, amount })); viewBooking(id);
  }));
  app.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => run(btn, async () => { must(await sb.from('invoices').delete().eq('id', btn.dataset.del)); viewBooking(id); }));
  $('finish')?.addEventListener('click', e => run(e.target, async () => {
    if (s.mode === 'percent' && !confirm(`إجمالي الفواتير ${money(total)}. متأكد إن الشيفت خلص؟ بعد كده الفواتير بتتقفل.`)) return;
    must(await sb.rpc('finish_shift', { p_booking:id })); toast('تم'); viewBooking(id);
  }));
  $('cancel')?.addEventListener('click', e => run(e.target, async () => {
    const hrs = (new Date(`${s.shift_date}T${s.start_time}+02:00`) - new Date()) / 36e5;
    const free = Number(S.settings.cancel_free_hours ?? 24);
    const msg = b.status === 'pending_payment' ? 'تلغي الحجز؟ مفيش أي رسوم.'
      : hrs >= free ? `تلغي الحجز؟ هيرجعلك ${money(b.amount_due)} خلال 3 أيام عمل.`
      : `الشيفت فاضل عليه أقل من ${free} ساعة، فالمبلغ (${money(b.amount_due)}) مش هيرجع وهيتحوّل للعيادة تعويض. تلغي برضه؟`;
    if (!confirm(msg)) return;
    must(await sb.rpc('cancel_booking', { p_booking:id })); toast('اتلغى'); viewBooking(id);
  }));
  bindReview(id, () => viewBooking(id));
}

function reviewBox(){
  return `<div class="card stack"><h2>قيّم الطرف التاني</h2>
    <div><label for="rv">التقييم</label><select id="rv">${[5,4,3,2,1].map(n => `<option value="${n}">${n} من 5</option>`).join('')}</select></div>

  }));
}

    <section class="card stack"><h2>حالاتي (قبل وبعد)</h2>

      <input id="p-cases" type="file" accept="image/*" multiple aria-label="رفع صور حالات">

      <div id="m-fixed"><label for="n-price">سعر الشيفت (جنيه)</label><input id="n-price" type="number" value="500" min="50"></div>
      <div id="m-pct" class="grid2" hidden><div><label for="n-pct">نسبة العيادة %</label><input id="n-pct" type="number" value="35" min="5" max="80"></div>
        <div><label for="n-min">الحد الأدنى (جنيه)</label><input id="n-min" type="number" value="300" min="0"></div></div>
      <p class="muted" style="margin:0" id="m-note"></p>
    </section>
    <section class="card stack"><h2>الشيفت يشمل</h2>
      <div><label for="n-inc">افصل بفاصلة</label><input id="n-inc" value="${esc((S.clinic.equipment || []).join('، '))}"></div>
      <div><label for="n-notes">ملاحظات</label><textarea id="n-notes" maxlength="400" placeholder="الخامات على الطبيب، أو متاحة بسعر الجملة"></textarea></div>
    </section>
    <button class="btn block" id="n-save" ${S.clinic.status !== 'verified' ? 'disabled' : ''}>اعرض الشيفت</button>`, '#/clinic/new');
  let mode = 'fixed';
  const fp = Number(S.settings.commission_fixed_pct), pp = Number(S.settings.commission_percent_pct), pm = Number(S.settings.commission_min);
  const note = () => $('m-note').textContent = mode === 'fixed'
    ? `عمولة المنصة ${fp}% من السعر، والباقي يتحوّل لك.`
    : `عمولة المنصة ${pp}% من دخل الشيفت (أقلها ${pm} جنيه) وبتتخصم من نصيبك. الطبيب بيدفع الحد الأدنى مقدمًا.`;
  const set = m => { mode = m; $('m-f').setAttribute('aria-pressed', m === 'fixed'); $('m-p').setAttribute('aria-pressed', m === 'percent');
    $('m-fixed').hidden = m !== 'fixed'; $('m-pct').hidden = m !== 'percent'; note(); };
  $('m-f').onclick = () => set('fixed'); $('m-p').onclick = () => set('percent'); note();
  $('n-save').onclick = e => run(e.target, async () => {
    const base = { clinic_id:S.clinic.id, start_time:$('n-s').value, end_time:$('n-e').value, mode,
      includes:csv($('n-inc').value), notes:$('n-notes').value.trim() || null };
    if (!(base.end_time > base.start_time)) throw new Error('معاد النهاية لازم يكون بعد البداية');
    if (mode === 'fixed') base.price = parseInt($('n-price').value,10);
    else { base.percent = parseInt($('n-pct').value,10); base.min_guarantee = parseInt($('n-min').value,10) || 0; }
    const n = parseInt($('n-rep').value,10), d0 = new Date($('n-d').value + 'T12:00:00');
    const rows = Array.from({ length:n }, (_, i) => ({ ...base, shift_date:new Date(d0.getTime() + i*7*864e5).toISOString().slice(0,10) }));
    must(await sb.from('shifts').insert(rows));
    toast(n > 1 ? `اتعرض ${n} شيفتات` : 'اتعرض الشيفت'); location.hash = '#/clinic';
  });
}

      <p class="muted">لو في فاتورة ناقصة كلّم الدعم قبل ما الشيفت يتقفل.</p></section>` : ''}

    </section>
    <section class="card stack"><h2>بيانات خاصة (لفريق DentaCore Shift بس)</h2>
      <div><label for="e-ad">العنوان بالتفصيل</label><input id="e-ad" maxlength="300" value="${esc(pv.address || '')}"></div>
      <div><label for="e-mp">لينك جوجل ماب</label><input id="e-mp" dir="ltr" maxlength="300" value="${esc(pv.map_link || '')}"></div></section>
    <section class="card stack"><h2>الصور</h2>
      ${r?.photo_paths?.length ? `<div class="thumbs">${r.photo_paths.map(x => `<img src="${esc(mediaUrl(x))}" alt="" loading="lazy">`).join('')}</div>` : ''}
      <input id="e-ph" type="file" accept="image/*" multiple aria-label="صور العيادة"></section>
    <section class="card stack"><h2>العمولة</h2>
      <p style="margin:0">عمولتنا ${monthsTxt(DV('rental_commission_months'))}، وبتستحق يوم إمضاء العقد بس. بتدفع منها ${(100 - DV('rental_tenant_pct')).toLocaleString('ar-EG')}%، والمستأجر بيدفع الباقي.</p>
      ${r ? '' : `<label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px"><input type="checkbox" id="e-ok" style="width:22px;min-height:22px;margin-top:2px;flex:none">
        <span>موافق على <a href="#/rental-terms" target="_blank">شروط الإيجار السنوي</a>، وإن كل التواصل مع المستأجرين يكون عن طريق DentaCore Shift لحد الإمضاء.</span></label>`}</section>
    <button class="btn block" id="e-save">${r ? 'حفظ' : 'ابعت الإعلان للمراجعة'}</button>`;
  $('e-save').onclick = e => run(e.target, async () => {
    if (!r && !$('e-ok').checked) throw new Error('لازم توافق على شروط الإيجار السنوي');
    const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
    const row = { title:$('e-t').value.trim(), area:$('e-a').value.trim(), monthly_rent:num($('e-r').value), min_months:num($('e-m').value) || minM,
      furnished:$('e-f').value, size_m2:num($('e-s').value), rooms:num($('e-ro').value), chairs:num($('e-c').value),
      features:csv($('e-ft').value), description:$('e-d').value.trim() || null };
    if (row.title.length < 3 || row.area.length < 2) throw new Error('اكتب عنوان الإعلان والمنطقة');
    if (!(row.monthly_rent >= 500)) throw new Error('اكتب الإيجار الشهري');
    if (row.min_months < minM) throw new Error(`أقل مدة للعقد ${minM} شهر`);
    const files = [...$('e-ph').files].slice(0, 8);
    if (files.length) { const ps = []; for (const f of files) ps.push(await upload('media', 'rentals', f)); row.photo_paths = [...ps, ...(r?.photo_paths || [])].slice(0, 8); }
    let rid = r?.id;
    if (r) must(await sb.from('rentals').update(row).eq('id', r.id));
    else rid = must(await sb.from('rentals').insert({ ...row, owner_id:S.me.id }).select('id').single()).id;
    must(await sb.from('rental_private').upsert({ rental_id:rid, address:$('e-ad').value.trim() || null, map_link:$('e-mp').value.trim() || null }));
    toast(r ? 'اتحفظ' : 'الإعلان اتبعت للمراجعة'); location.hash = '#/clinic/rentals';
  });
}

async function adminRentals(box, names, contacts, docBtn){
  const pend = must(await sb.from('rentals').select('*').eq('status','pending').order('created_at'));
  const leads = must(await sb.from('rental_leads').select('*, rentals(id, title, area, monthly_rent, owner_id)').order('created_at', { ascending:false }).limit(150));
  const open = leads.filter(l => !['signed','lost'].includes(l.status));
  const unpaid = leads.filter(l => l.status === 'signed' && !(l.tenant_paid && l.owner_paid));
  const ids = [...pend.map(r => r.owner_id), ...leads.map(l => l.seeker_id), ...leads.map(l => l.rentals?.owner_id)];
  const n = await names(ids), c = await contacts(ids);
  const priv = pend.length ? Object.fromEntries(must(await sb.from('rental_private').select('*').in('rental_id', pend.map(r => r.id))).map(x => [x.rental_id, x])) : {};
  const wa = (uid, txt, label) => { const num = waNum(c[uid]?.phone); return num ? `<a class="btn wa" style="min-height:38px" href="${esc(waHref(num, txt))}" target="_blank" rel="noopener">${icon.wa} ${label}</a>` : `<span class="muted">${label}: مفيش رقم</span>`; };
  const steps = ['new','contacted','viewing','negotiating','lost'];
  const leadCard = l => { const r = l.rentals || {}; return `<div class="card stack">
    <div class="between"><strong>${esc(r.title)} · ${money(r.monthly_rent)}</strong>${chip(l.status)}</div>
    <div class="muted">${esc(r.area)} · طلب ${dtAr(l.created_at)}</div>
    <div>المستأجر: د. ${esc(n[l.seeker_id])} <span dir="ltr" class="muted">${esc(c[l.seeker_id]?.phone || '')}</span></div>
    <div>المالك: د. ${esc(n[r.owner_id])} <span dir="ltr" class="muted">${esc(c[r.owner_id]?.phone || '')}</span></div>
    ${l.message ? `<div class="notice ok">${esc(l.message)}</div>` : ''}
    <div class="row">${wa(l.seeker_id, `أهلًا د. ${n[l.seeker_id] || ''}، معاك فريق DentaCore Shift بخصوص طلبك على «${r.title}».`, 'كلّم المستأجر')}
      ${wa(r.owner_id, `أهلًا د. ${n[r.owner_id] || ''}، معاك فريق DentaCore Shift بخصوص إعلان «${r.title}».`, 'كلّم المالك')}</div>
    ${l.status === 'signed' ? `
      <div>الإيجار في العقد ${money(l.final_rent)} · العمولة ${money(l.commission)}</div>
      <label class="row" style="color:var(--ink)"><input type="checkbox" data-paid="${l.id}|tenant_paid" ${l.tenant_paid ? 'checked' : ''} style="width:22px;min-height:22px"> المستأجر دفع ${money(l.tenant_fee)}</label>
      <label class="row" style="color:var(--ink)"><input type="checkbox" data-paid="${l.id}|owner_paid" ${l.owner_paid ? 'checked' : ''} style="width:22px;min-height:22px"> المالك دفع ${money(l.owner_fee)}</label>`
    : `<div class="grid2"><select id="ls-${l.id}" aria-label="الحالة">${steps.map(s => `<option value="${s}" ${l.status === s ? 'selected' : ''}>${statusLabel[s][0]}</option>`).join('')}</select>
        <button class="btn sec" data-lsave="${l.id}">حفظ</button></div>
      <textarea id="ln-${l.id}" maxlength="1000" placeholder="ملاحظات داخلية" aria-label="ملاحظات">${esc(l.admin_note || '')}</textarea>
      <button class="btn" data-sign="${l.id}|${r.monthly_rent}">اتمضى العقد</button>`}</div>`; };
  box.innerHTML = `<h2>إعلانات مستنية مراجعة (${pend.length})</h2>` + (pend.map(r => `<div class="card stack">
      <strong>${esc(r.title)} — ${esc(r.area)}</strong>
      <div>${money(r.monthly_rent)} في الشهر · عقد ${r.min_months} شهر · ${rentalFacts(r).map(esc).join(' · ')}</div>
      <div class="muted">المالك: د. ${esc(n[r.owner_id])} <span dir="ltr">${esc(c[r.owner_id]?.phone || '')}</span></div>
      <div class="muted">العنوان: ${esc(priv[r.id]?.address || '—')} ${priv[r.id]?.map_link ? `· <a href="${esc(priv[r.id].map_link)}" target="_blank" rel="noopener">الخريطة</a>` : ''}</div>
      ${r.photo_paths.length ? `<div class="thumbs">${r.photo_paths.map(x => `<img src="${esc(mediaUrl(x))}" alt="" loading="lazy">`).join('')}</div>` : ''}
      ${r.description ? `<p style="margin:0;white-space:pre-line" class="muted">${esc(r.description)}</p>` : ''}
      <div class="row">${wa(r.owner_id, `أهلًا د. ${n[r.owner_id] || ''}، معاك فريق DentaCore Shift بخصوص إعلان «${r.title}».`, 'كلّم المالك')}</div>
      <div class="row"><button class="btn" data-rv="${r.id}|1">انشر</button><button class="btn bad" data-rv="${r.id}|0">رفض</button></div></div>`).join('') || '<div class="card muted">مفيش</div>')
    + `<h2 style="margin-top:12px">طلبات شغالة (${open.length})</h2><p class="muted">ما تدّيش رقم أو عنوان أي طرف للتاني قبل الإمضاء. رتّب المعاينة بنفسك.</p>` + (open.map(leadCard).join('') || '<div class="card muted">مفيش</div>')
    + `<h2 style="margin-top:12px">عمولات لسه ما اتحصّلتش (${unpaid.length})</h2>` + (unpaid.map(leadCard).join('') || '<div class="card muted">مفيش</div>');
  box.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => run(b, async () => {
    const [id, ok] = b.dataset.rv.split('|'); let reason = null;
    if (ok === '0') { reason = prompt('سبب الرفض (هيظهر لصاحب الإعلان):'); if (reason === null) return; }
    must(await sb.rpc('admin_review_rental', { p_rental:id, p_ok:ok === '1', p_reason:reason })); viewAdmin('rentals');
  }));
  box.querySelectorAll('[data-lsave]').forEach(b => b.onclick = () => run(b, async () => {
    const id = b.dataset.lsave;
    must(await sb.from('rental_leads').update({ status:$('ls-' + id).value, admin_note:$('ln-' + id).value.trim() || null }).eq('id', id)); toast('اتحفظ'); viewAdmin('rentals');
  }));
  box.querySelectorAll('[data-sign]').forEach(b => b.onclick = () => run(b, async () => {
    const [id, rent] = b.dataset.sign.split('|');
    const v = prompt('الإيجار الشهري المكتوب في العقد (جنيه):', rent); if (v === null) return;
    const fr = parseInt(v, 10); if (!(fr > 0)) throw new Error('رقم غلط');
    if (!confirm(`العمولة ${money(fr * DV('rental_commission_months'))}: المستأجر ${money(rentFee(fr))} والمالك ${money(ownerFee(fr))}. تأكيد؟`)) return;
    must(await sb.rpc('admin_sign_rental', { p_lead:id, p_final_rent:fr })); viewAdmin('rentals');
  }));
  box.querySelectorAll('[data-paid]').forEach(x => x.onchange = () => run(null, async () => {
    const [id, col] = x.dataset.paid.split('|');
    must(await sb.from('rental_leads').update({ [col]:x.checked }).eq('id', id)); toast('اتحفظ');
  }));
}

/* ---------- الراوتر ---------- */
async function route(){
  if (!configured) { app.innerHTML = '<main><div class="card" style="margin-top:24px">الموقع محتاج يتربط بـ Supabase: حط Project URL و anon key في أول الملف.</div></main>'; return; }
  const h = location.hash.replace(/^#/, '') || '/';
  const [, p1, p2, p3] = h.split('/');
  if (h.startsWith('/reset')) return viewReset();
  if (legalTitles[p1]) return viewLegal(p1);
  if (!S.session) return viewAuth(p1 === 'signup' ? 'signup' : 'login');
  if (!S.me) { try { await loadMe(); } catch(e) { toast(errMsg(e)); return; } }
  const r = S.me.role;
  try {
    if (r === 'doctor') {
      if (p1 === 'shift' && p2) return await viewShift(p2);
      if (p1 === 'bookings') return await viewBookings();
      if (p1 === 'booking' && p2) return await viewBooking(p2);
      if (p1 === 'profile') return await viewProfile();
      if (p1 === 'rentals') return await viewRentals();
      if (p1 === 'rental' && p2) return await viewRental(p2);
      if (p1 === 'my-rentals') return await viewMyRentalLeads();
      return await viewShifts();
    }
    if (r === 'clinic') {
      if (p1 === 'clinic' && p2 === 'edit') return await viewClinicEdit();
      if (p1 === 'clinic' && p2 === 'new') return viewNewShift();
      if (p1 === 'clinic' && p2 === 'booking' && p3) return await viewClinicBooking(p3);
      if (p1 === 'hire' && p2) return await viewHire(p2);
      if (p1 === 'clinic' && p2 === 'rentals') return await viewClinicRentals();
      if (p1 === 'clinic' && p2 === 'rental' && p3) return await viewRentalEdit(p3 === 'new' ? null : p3);
      return await viewClinic();
    }
    if (r === 'admin') return await viewAdmin();
  } catch(e) { toast(errMsg(e)); console.error(e); }
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => { const c = e.target.closest('[data-copy]'); if (!c) return;
  (navigator.clipboard ? navigator.clipboard.writeText(c.dataset.copy) : Promise.reject()).then(() => toast('اتنسخ ✓'), () => prompt('انسخ من هنا:', c.dataset.copy)); });

if (configured) {
  sb.auth.onAuthStateChange((ev, session) => {
    const changed = (S.session?.user?.id) !== (session?.user?.id);
    S.session = session;
    if (ev === 'PASSWORD_RECOVERY') { location.hash = '#/reset'; return; }
    if (changed) { S.me = null; route(); }
  });
  sb.rpc('public_links').then(({ data }) => { if (data) { S.links = data; const f = document.querySelector('footer'); if (f) f.outerHTML = legalLinks(); } });
  sb.auth.getSession().then(({ data }) => { S.session = data.session; route(); });
} else route();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
